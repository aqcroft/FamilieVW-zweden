<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174f42">
  <title>Rondreis Zweden 2026 - interactieve reisplanner</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css?v=1.9.4">

  <style>
    :root {
      --green-900: #123d34;
      --green-800: #174f42;
      --green-700: #216b5a;
      --green-100: #eaf4f0;
      --blue-700: #1f6086;
      --blue-100: #e7f3fa;
      --orange: #ed6a17;
      --orange-soft: #fff0e6;
      --yellow-soft: #fff9dd;
      --red-soft: #fff0ee;
      --ink: #24302d;
      --muted: #64726e;
      --line: #d7e2de;
      --surface: #ffffff;
      --page: #f4f7f5;
      --shadow: 0 12px 30px rgba(22, 54, 46, .11);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    header {
      padding: 14px 18px 12px;
      background: linear-gradient(
        135deg,
        var(--green-900),
        var(--green-700)
      );
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      font-size: clamp(1.15rem, 2vw, 1.65rem);
      margin: 0;
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .brand p {
      margin: 4px 0 0;
      opacity: .82;
      font-size: .88rem;
    }

    .trip-badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .22);
      font-size: .82rem;
      white-space: nowrap;
    }

    .toolbar {
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .toolbar button,
    .toolbar a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: white;
      color: var(--green-900);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar button:hover,
    .toolbar a:hover {
      background: var(--green-100);
    }

    .toolbar .primary {
      background: var(--green-800);
      color: white;
      border-color: var(--green-800);
    }

    .toolbar .spacer {
      flex: 1 0 12px;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(330px, 420px) 1fr;
    }

    aside {
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: var(--page);
      scroll-behavior: smooth;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #d8eef8;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .summary-card,
    .filters-card,
    .day-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 5px 16px rgba(26, 62, 53, .05);
    }

    .summary-card {
      padding: 14px;
      margin-bottom: 12px;
    }

    .summary-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-title h2 {
      font-size: 1rem;
      margin: 0;
      color: var(--green-900);
    }

    .summary-title span {
      font-size: .78rem;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--green-100);
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }

    .stat strong {
      display: block;
      color: var(--green-900);
      font-size: .95rem;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      margin-top: 2px;
    }

    .filters-card {
      padding: 12px;
      margin-bottom: 12px;
    }

    .filters-title {
      font-weight: 800;
      color: var(--green-900);
      font-size: .9rem;
      margin-bottom: 9px;
    }

    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-chip {
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: white;
      font-size: .78rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip input {
      accent-color: var(--green-800);
    }

    .search {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    .search:focus {
      border-color: var(--green-700);
      box-shadow: 0 0 0 3px rgba(33, 107, 90, .12);
    }

    .timeline-label {
      margin: 14px 3px 9px;
      color: var(--green-900);
      font-weight: 900;
      font-size: .92rem;
    }

    .day-card {
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
      position: relative;
      overflow: hidden;
    }

    .day-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .day-card.active {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(237, 106, 23, .13);
    }

    .day-card.today::before {
      content: "Vandaag";
      position: absolute;
      right: 10px;
      top: 10px;
      background: var(--orange);
      color: white;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: .68rem;
      font-weight: 900;
    }

    .day-date {
      color: var(--blue-700);
      font-size: .76rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .day-card h3 {
      font-size: 1rem;
      margin: 4px 0 5px;
      padding-right: 58px;
      line-height: 1.25;
    }

    .day-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }

    .pill {
      font-size: .71rem;
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--blue-100);
      color: var(--blue-700);
      font-weight: 800;
    }

    .pill.drive {
      background: var(--orange-soft);
      color: #9d3c00;
    }

    .pill.rest {
      background: var(--green-100);
      color: var(--green-800);
    }

    .pill.long {
      background: var(--red-soft);
      color: #9d261f;
    }

    .day-summary {
      margin: 0;
      color: var(--muted);
      font-size: .83rem;
      line-height: 1.45;
    }

    .details {
      display: none;
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
    }

    .day-card.active .details {
      display: block;
    }

    .detail-section {
      margin-top: 9px;
    }

    .detail-section strong {
      display: block;
      color: var(--green-900);
      font-size: .78rem;
      margin-bottom: 4px;
    }

    .detail-section ul {
      margin: 0;
      padding-left: 18px;
      color: #42504c;
      font-size: .79rem;
      line-height: 1.48;
    }

    .walk-box,
    .tip-box,
    .camp-box {
      border-radius: 12px;
      padding: 9px 10px;
      margin-top: 9px;
      font-size: .78rem;
      line-height: 1.45;
    }

    .walk-box {
      background: var(--green-100);
    }

    .tip-box {
      background: var(--yellow-soft);
    }

    .camp-box {
      background: #f2effb;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .card-actions a,
    .card-actions button {
      border: 1px solid var(--line);
      background: white;
      color: var(--green-900);
      border-radius: 10px;
      padding: 7px 9px;
      text-decoration: none;
      font-size: .74rem;
      font-weight: 800;
      cursor: pointer;
    }

    .booking {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .booking label {
      font-size: .74rem;
      color: var(--muted);
      font-weight: 800;
      display: block;
      margin: 7px 0 4px;
    }

    .booking select,
    .booking textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 9px;
      background: white;
    }

    .booking textarea {
      min-height: 62px;
      resize: vertical;
    }

    .footer-note {
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.45;
      padding: 10px 4px 20px;
    }

    .route-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--orange);
      border: 3px solid white;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .25);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: .78rem;
    }

    .minor-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue-700);
      border: 2px solid white;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
      display: grid;
      place-items: center;
      font-size: .65rem;
    }

    .walk-marker {
      background: var(--green-700);
    }

    .camp-marker {
      background: #6f4ca5;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .leaflet-popup-content {
      margin: 13px 15px;
      line-height: 1.4;
    }

    .popup-title {
      font-weight: 900;
      color: var(--green-900);
      margin-bottom: 4px;
    }

    .popup-sub {
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 8px;
    }

    .popup-link {
      display: inline-block;
      text-decoration: none;
      background: var(--green-800);
      color: white !important;
      border-radius: 9px;
      padding: 7px 9px;
      font-size: .76rem;
      font-weight: 800;
      margin-top: 5px;
    }

    .legend {
      background: white;
      border-radius: 12px;
      padding: 9px 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
      font-size: .73rem;
      line-height: 1.55;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .
